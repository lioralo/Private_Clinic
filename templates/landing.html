<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Go</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-color: #1c1c1e;
            --surface-color: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-color: #00ffff;
            --nav-bg: #1f1f1f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Manrope', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px;
            min-height: 100vh;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-top: 10px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .notification-btn {
            background-color: var(--surface-color);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            position: relative;
        }

        .notification-btn::after {
            content: '';
            position: absolute;
            top: 12px;
            right: 14px;
            width: 8px;
            height: 8px;
            background-color: #ff453a;
            border-radius: 50%;
            border: 2px solid var(--surface-color);
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        .search-bar {
            flex: 1;
            background-color: var(--surface-color);
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .search-bar i {
            color: var(--text-secondary);
            font-size: 20px;
            margin-right: 12px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            width: 100%;
            height: 56px;
            font-size: 16px;
            outline: none;
        }

        .search-bar input::placeholder {
            color: var(--text-secondary);
        }

        .filter-btn {
            background-color: var(--surface-color);
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        .categories-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
        }

        .see-all {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .category-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 32px;
            scrollbar-width: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-pill {
            background-color: var(--surface-color);
            color: var(--text-primary);
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-pill.active {
            background-color: var(--accent-color);
            color: #000000;
        }

        .category-pill.active i {
            color: #000000;
        }

        .popular-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .cards-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 24px;
            scrollbar-width: none;
        }

        .cards-scroll::-webkit-scrollbar {
            display: none;
        }

        .product-card {
            background-color: var(--surface-color);
            border-radius: 24px;
            min-width: 260px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-image {
            width: 100%;
            height: 200px;
            border-radius: 20px;
            object-fit: cover;
            position: relative;
            overflow: hidden;
        }

        .img-1 { background: #3b82f6; }
        .img-2 { background: #10b981; }

        .favorite-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(8px);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .product-info {
            padding: 4px;
        }

        .product-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .product-location {
            color: var(--text-secondary);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
        }

        .product-price span {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            font-weight: 600;
        }

        .product-rating i {
            color: #fbbf24;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--nav-bg);
            padding: 20px 24px 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            max-width: 480px;
            margin: 0 auto;
            z-index: 100;
        }

        .nav-item {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 24px;
            position: relative;
            padding-bottom: 8px;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            width: 4px;
            height: 4px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }

        @media (min-width: 481px) {
            body { background-color: #000000; }
            .container, .bottom-nav { background-color: var(--bg-color); }
            .bottom-nav { left: auto; right: auto; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Let's Go</h1>
            <button class="notification-btn">
                <i class="bi bi-bell"></i>
            </button>
        </div>

        <div class="search-container">
            <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" placeholder="Search camper, or...">
            </div>
            <button class="filter-btn">
                <i class="bi bi-sliders"></i>
            </button>
        </div>

        <div class="categories-header">
            <h2 class="section-title">Category</h2>
            <a href="#" class="see-all">See All</a>
        </div>
        <div class="category-scroll">
            <button class="category-pill active">All</button>
            <button class="category-pill"><i class="bi bi-fire"></i> Camp</button>
            <button class="category-pill"><i class="bi bi-tree"></i> Hike</button>
            <button class="category-pill"><i class="bi bi-bicycle"></i> Ride</button>
            <button class="category-pill"><i class="bi bi-water"></i> Swim</button>
        </div>

        <div class="popular-header">
            <h2 class="section-title">Popular</h2>
            <a href="#" class="see-all">See All</a>
        </div>
        <div class="cards-scroll">
            <div class="product-card">
                <div class="product-image img-1">
                    <button class="favorite-btn">
                        <i class="bi bi-heart"></i>
                    </button>
                </div>
                <div class="product-info">
                    <div class="product-title">Mount Fuji Camp</div>
                    <div class="product-location">
                        <i class="bi bi-geo-alt-fill"></i> Tokyo, Japan
                    </div>
                    <div class="product-footer">
                        <div class="product-price">$120<span>/night</span></div>
                        <div class="product-rating">
                            <i class="bi bi-star-fill"></i> 4.8
                        </div>
                    </div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image img-2">
                    <button class="favorite-btn">
                        <i class="bi bi-heart"></i>
                    </button>
                </div>
                <div class="product-info">
                    <div class="product-title">Alpine Lake Tent</div>
                    <div class="product-location">
                        <i class="bi bi-geo-alt-fill"></i> Swiss Alps
                    </div>
                    <div class="product-footer">
                        <div class="product-price">$95<span>/night</span></div>
                        <div class="product-rating">
                            <i class="bi bi-star-fill"></i> 4.9
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <i class="bi bi-house-door-fill"></i>
            </a>
            <a href="#" class="nav-item">
                <i class="bi bi-compass"></i>
            </a>
            <a href="#" class="nav-item">
                <i class="bi bi-heart"></i>
            </a>
            <a href="{{ url_for('login') }}" class="nav-item" title="Login to Clinic Portal">
                <i class="bi bi-person"></i>
            </a>
        </nav>
    </div>
</body>
</html>
