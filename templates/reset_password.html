{% extends 'layout.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-2">{{ t('Set New Password') }}</h4>
                    <p class="text-muted small mb-4">{{ t('Choose a strong password: at least 10 characters with uppercase, lowercase, number, and special character.') }}</p>
                    <form method="post" class="row g-3" id="resetPasswordForm">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="col-12">
                            <label class="form-label small fw-bold">{{ t('New Password') }}</label>
                            <input type="password" name="new_password" id="resetNewPassword" class="form-control" required autofocus>
                            <div class="mt-2" id="pwStrengthIndicator" aria-live="polite">
                                <div class="d-flex flex-wrap gap-1 mt-1" id="pwChecks">
                                    <span class="badge rounded-pill border pw-check" id="pwc-len" data-key="len">10+ chars</span>
                                    <span class="badge rounded-pill border pw-check" id="pwc-upper" data-key="upper">Uppercase</span>
                                    <span class="badge rounded-pill border pw-check" id="pwc-lower" data-key="lower">Lowercase</span>
                                    <span class="badge rounded-pill border pw-check" id="pwc-digit" data-key="digit">Number</span>
                                    <span class="badge rounded-pill border pw-check" id="pwc-special" data-key="special">Special char</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">{{ t('Confirm New Password') }}</label>
                            <input type="password" name="confirm_password" id="resetConfirmPassword" class="form-control" required>
                            <div class="mt-1 small" id="pwMatchMsg" style="min-height:1.2em"></div>
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">{{ t('Update Password') }}</button>
                            <a href="{{ url_for('login') }}" class="btn btn-outline-secondary rounded-pill px-4">{{ t('Back to Login') }}</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.pw-check { font-size: .78rem; background: #f1f5f9; color: #64748b; border-color: #e2e8f0 !important; transition: background .2s, color .2s; }
.pw-check.ok  { background: #dcfce7; color: #166534; border-color: #86efac !important; }
.pw-check.bad { background: #fee2e2; color: #991b1b; border-color: #fca5a5 !important; }
</style>

<script>
(function () {
    var newPw  = document.getElementById('resetNewPassword');
    var confPw = document.getElementById('resetConfirmPassword');
    var matchMsg = document.getElementById('pwMatchMsg');

    function check(val) {
        return {
            len:     val.length >= 10,
            upper:   /[A-Z]/.test(val),
            lower:   /[a-z]/.test(val),
            digit:   /[0-9]/.test(val),
            special: /[^A-Za-z0-9]/.test(val),
        };
    }

    function updateBadges() {
        if (!newPw) return;
        var val = newPw.value;
        var results = check(val);
        document.querySelectorAll('.pw-check').forEach(function (el) {
            var key = el.dataset.key;
            var ok = !!results[key];
            el.classList.toggle('ok', ok);
            el.classList.toggle('bad', val.length > 0 && !ok);
        });
        if (confPw) {
            var match = confPw.value.length > 0 && confPw.value === val;
            matchMsg.textContent = confPw.value.length > 0
                ? (match ? '✓ Passwords match' : '✗ Passwords do not match')
                : '';
            matchMsg.style.color = match ? '#166534' : '#991b1b';
        }
    }

    if (newPw)  newPw.addEventListener('input', updateBadges);
    if (confPw) confPw.addEventListener('input', updateBadges);
})();
</script>
{% endblock %}
