{% extends 'layout.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-2">{{ t('Set New Password') }}</h4>
                    <p class="text-muted small mb-4">{{ t('Choose a new admin password with at least 8 characters.') }}</p>
                    <form method="post" class="row g-3">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="col-12">
                            <label class="form-label small fw-bold">{{ t('New Password') }}</label>
                            <input type="password" name="new_password" class="form-control" required autofocus>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">{{ t('Confirm New Password') }}</label>
                            <input type="password" name="confirm_password" class="form-control" required>
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">{{ t('Update Password') }}</button>
                            <a href="{{ url_for('login') }}" class="btn btn-outline-secondary rounded-pill px-4">{{ t('Back to Login') }}</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
