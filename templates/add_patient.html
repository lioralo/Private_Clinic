{% extends 'layout.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('patients', status='ongoing') }}" class="btn btn-outline-secondary btn-sm rounded-circle p-2 me-3 lh-1">
                <i class="bi bi-chevron-left"></i>
            </a>
            <h2 class="mb-0 fw-bold text-primary">{{ t('Add New Patient') }}</h2>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-4 p-lg-5">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="row g-4">
                        <div class="col-md-8">
                            <label for="name" class="form-label text-uppercase smallest fw-bold">{{ t('Full Name') }}</label>
                            <input type="text" class="form-control" name="name" id="name" placeholder="{{ t('Full Name') }}" required>
                        </div>

                        <div class="col-md-4">
                            <label for="status" class="form-label text-uppercase smallest fw-bold">{{ t('Initial Status') }}</label>
                            <select class="form-select" name="status" id="status" required>
                                <option value="ongoing">{{ t('Ongoing') }}</option>
                                <option value="candidate">{{ t('Candidate') }}</option>
                                <option value="waiting for scheduling">{{ t('Waiting for Scheduling') }}</option>
                                <option value="archived">{{ t('Archived') }}</option>
                            </select>
                        </div>

                        <div class="col-md-12">
                            <label for="email" class="form-label text-uppercase smallest fw-bold">{{ t('Email Address') }}</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" name="email" id="email" placeholder="{{ t('Email Address') }}">
                            </div>
                        </div>

                        <div class="col-md-12">
                            <label for="phone" class="form-label text-uppercase smallest fw-bold">{{ t('Phone Number') }}</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                                <input type="tel" class="form-control" name="phone" id="phone" placeholder="{{ t('Phone Number') }}">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="birth_date" class="form-label text-uppercase smallest fw-bold">{{ t('Date of Birth') }}</label>
                            <input type="date" class="form-control" name="birth_date" id="birth_date">
                        </div>

                        <div class="col-md-6">
                            <label for="id_number" class="form-label text-uppercase smallest fw-bold">{{ t('ID Number') }}</label>
                            <input type="text" class="form-control" name="id_number" id="id_number" placeholder="{{ t('ID Number') }}" maxlength="20">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label text-uppercase smallest fw-bold">{{ t('Patient Type') }}</label>
                            <div class="d-flex gap-3 mt-1">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="patient_type" id="typePrivate" value="private" checked>
                                    <label class="form-check-label" for="typePrivate">
                                        <i class="bi bi-person me-1"></i>{{ t('Private') }}
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="patient_type" id="typeResidency" value="residency">
                                    <label class="form-check-label" for="typeResidency">
                                        <i class="bi bi-mortarboard me-1"></i>{{ t('Residency') }}
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="patient_type" id="typeGroup" value="group">
                                    <label class="form-check-label" for="typeGroup">
                                        <i class="bi bi-people-fill me-1"></i>{{ t('Group') }}
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="patient_type" id="typeInitialIntake" value="initial-intake">
                                    <label class="form-check-label" for="typeInitialIntake">
                                        <i class="bi bi-clipboard2-pulse me-1"></i>{{ t('Initial Intake') }}
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 mt-5">
                            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill">
                                <i class="bi bi-person-check me-2"></i> {{ t('Register Patient Record') }}
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <p class="text-center mt-4 text-muted small">
            {{ t('New records are automatically initialized in the database.') }}
        </p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const typeInputs = document.querySelectorAll('input[name="patient_type"]');
    typeInputs.forEach((input) => input.addEventListener('change', function () {
        if (input.checked && input.value === 'initial-intake') {
            document.getElementById('status').value = 'candidate';
        }
    }));
});
</script>
{% endblock %}
