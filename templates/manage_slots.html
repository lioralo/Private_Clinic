{% extends 'layout.html' %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold"><i class="bi bi-calendar-range me-2 text-primary"></i>Manage Slots</h5>
            </div>
            <div class="card-body p-4">
                <div id="admin-calendar"></div>
            </div>
        </div>
    </div>
</div>

<!-- Modal for slot management -->
<div class="modal fade" id="slotModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Manage Slot</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Manage slot for <span id="slotDateTime" class="fw-bold"></span>.</p>
        <form id="slotForm" method="POST" action="{{ url_for('admin_manage_slots') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="date" id="slotDate">
            <input type="hidden" name="time" id="slotTime">
            
            <!-- Slot Mode: Regular or Patient Booking -->
            <div class="mb-3">
                <label for="slotMode" class="form-label fw-bold">Slot Type</label>
                <select class="form-select" name="slot_mode" id="slotMode" onchange="togglePatientFields()">
                    <option value="override">Manage Availability (Open/Blocked/Reserved)</option>
                    <option value="patient_booking">Book for Patient</option>
                </select>
            </div>

            <!-- Regular Slot Management (Hidden by default) -->
            <div id="overrideFields" style="display: block;">
                <div class="mb-3">
                    <label for="duration" class="form-label">Duration</label>
                    <select class="form-select" name="duration" id="slotDuration">
                        <option value="30">30 minutes</option>
                        <option value="60" selected>60 minutes</option>
                        <option value="90">90 minutes</option>
                        <option value="120">120 minutes</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Slot Status</label>
                    <select class="form-select" name="status" id="slotStatus" required>
                        <option value="open">Open (Clickable for patients)</option>
                        <option value="occupied">Occupied (Busy)</option>
                        <option value="blocked">Blocked (Unavailable)</option>
                    </select>
                </div>
            </div>

            <!-- Patient Booking Fields (Hidden by default) -->
            <div id="patientFields" style="display: none;">
                <div class="mb-3">
                    <label for="patientSelect" class="form-label fw-bold">Select Patient</label>
                    <select class="form-select" name="patient_id" id="patientSelect">
                        <option value="">-- Select a patient --</option>
                        {% for p in all_patients %}
                            <option value="{{ p['id'] }}">{{ p['name'] }} ({{ p['status'] }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="bookingDuration" class="form-label">Duration</label>
                    <select class="form-select" name="booking_duration" id="bookingDuration">
                        <option value="30">30 minutes</option>
                        <option value="60" selected>60 minutes</option>
                        <option value="90">90 minutes</option>
                        <option value="120">120 minutes</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="bookingCost" class="form-label">Cost</label>
                    <input type="number" step="0.01" name="booking_cost" id="bookingCost" class="form-control" placeholder="0.00" value="0">
                </div>

                <div class="mb-3">
                    <label for="meetingType" class="form-label">Meeting Type</label>
                    <select class="form-select" name="meeting_type" id="meetingType">
                        <option value="in-person" selected>In-Person</option>
                        <option value="online">Online</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="meetingLink" class="form-label">Meeting Link (for online meetings)</label>
                    <input type="url" name="meeting_link" id="meetingLink" class="form-control" placeholder="https://zoom.us/...">
                </div>

                <!-- Recurring Options -->
                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="is_recurring" id="isRecurring" onchange="toggleRecurrenceFields()">
                        <label class="form-check-label fw-bold" for="isRecurring">
                            Make this a recurring appointment
                        </label>
                    </div>
                </div>

                <!-- Recurrence Details (Hidden by default) -->
                <div id="recurrenceDetails" style="display: none;" class="p-3 bg-light rounded-2 mb-3">
                    <div class="mb-3">
                        <label for="recurrenceInterval" class="form-label">Interval</label>
                        <select class="form-select" name="recurrence_interval" id="recurrenceInterval">
                            <option value="1" selected>Every Week</option>
                            <option value="2">Every 2 Weeks</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Days of Week</label>
                        <div class="row g-2">
                            <div class="col-auto">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="recurrence_days" value="0" id="day_sunday">
                                    <label class="form-check-label" for="day_sunday">Sun</label>
                                </div>
                            </div>
                            <div class="col-auto">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="recurrence_days" value="1" id="day_monday" checked>
                                    <label class="form-check-label" for="day_monday">Mon</label>
                                </div>
                            </div>
                            <div class="col-auto">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="recurrence_days" value="2" id="day_tuesday">
                                    <label class="form-check-label" for="day_tuesday">Tue</label>
                                </div>
                            </div>
                            <div class="col-auto">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="recurrence_days" value="3" id="day_wednesday">
                                    <label class="form-check-label" for="day_wednesday">Wed</label>
                                </div>
                            </div>
                            <div class="col-auto">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="recurrence_days" value="4" id="day_thursday">
                                    <label class="form-check-label" for="day_thursday">Thu</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">End Limit</label>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="recurrence_limit_type" id="limitByDate" value="date">
                            <label class="form-check-label" for="limitByDate">Until Date</label>
                            <input type="date" name="recurrence_end_date" id="recurrenceEndDate" class="form-control form-control-sm mt-1">
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="recurrence_limit_type" id="limitByCount" value="count" checked>
                            <label class="form-check-label" for="limitByCount">Number of Sessions</label>
                            <input type="number" name="recurrence_count" id="recurrenceCount" class="form-control form-control-sm mt-1" value="12" min="1">
                        </div>
                    </div>
                </div>
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary rounded-pill fw-bold" onclick="document.getElementById('slotForm').submit()">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
function togglePatientFields() {
    const mode = document.getElementById('slotMode').value;
    document.getElementById('overrideFields').style.display = mode === 'override' ? 'block' : 'none';
    document.getElementById('patientFields').style.display = mode === 'patient_booking' ? 'block' : 'none';
}

function toggleRecurrenceFields() {
    const isRecurring = document.getElementById('isRecurring').checked;
    document.getElementById('recurrenceDetails').style.display = isRecurring ? 'block' : 'none';
}
</script>

<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('admin-calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        hiddenDays: [5, 6], // Hide Friday and Saturday
        slotMinTime: '08:00:00',
        slotMaxTime: '20:00:00',
        allDaySlot: false,
        firstDay: 0, // Sunday
        height: 'auto',
        headerToolbar: {
            left: 'prev,next today refreshBtn',
            center: 'title',
            right: 'timeGridWeek'
        },
        customButtons: {
            refreshBtn: {
                text: 'Refresh',
                click: function() {
                    calendar.refetchEvents();
                }
            }
        },
        events: '/api/slots', // Use same endpoint for admin to see slots
        selectable: true,
        select: function(info) {
            // Selecting an empty area opens modal to create new slot override
            var d = info.start;
            var dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            var timeStr = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');

            document.getElementById('slotDate').value = dateStr;
            document.getElementById('slotTime').value = timeStr;
            document.getElementById('slotDateTime').innerText = dateStr + ' at ' + timeStr;
            document.getElementById('slotStatus').value = 'open'; // default
            document.getElementById('slotDuration').value = '60'; // default

            var modal = new bootstrap.Modal(document.getElementById('slotModal'));
            modal.show();
        },
        eventClick: function(info) {
            // Clicking existing event to edit
            var d = info.event.start;
            var dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            var timeStr = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');

            document.getElementById('slotDate').value = dateStr;
            document.getElementById('slotTime').value = timeStr;
            document.getElementById('slotDateTime').innerText = dateStr + ' at ' + timeStr;
            document.getElementById('slotStatus').value = info.event.extendedProps.status;
            document.getElementById('slotDuration').value = info.event.extendedProps.duration_minutes || '60';

            var modal = new bootstrap.Modal(document.getElementById('slotModal'));
            modal.show();
        }
    });
    calendar.render();
    
    // Auto-refresh calendar every 30 seconds
    setInterval(function() {
        calendar.refetchEvents();
    }, 30000);
});
</script>
{% endblock %}
