{% extends 'layout.html' %}

{% block content %}
<div class="row">
    <div class="col-lg-12 mb-4">
        <h2 class="mb-3 text-primary fw-bold"><i class="bi bi-calendar-range me-2"></i>Scheduling Management</h2>
        <p class="text-muted">Manage available appointment slots for patients to request.</p>
    </div>

    <div class="col-lg-4 mb-4">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white py-3 border-0">
                <h5 class="mb-0 fw-bold">Add New Slot</h5>
            </div>
            <div class="card-body p-4">
                <form method="post" action="{{ url_for('add_slot') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Start Time</label>
                        <input type="datetime-local" name="start_time" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">End Time</label>
                        <input type="datetime-local" name="end_time" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Create Slot</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">Calendar View</h5>
                <span class="badge bg-light text-muted border smallest"><i class="bi bi-info-circle me-1"></i>Click events to delete</span>
            </div>
            <div class="card-body p-4">
                <div id="calendar" class="bg-white"></div>
            </div>
        </div>
    </div>
</div>

<!-- FullCalendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: '/api/slots',
        eventClick: function(info) {
            if (confirm('Are you sure you want to delete this slot?')) {
                // We'll use a form post for CSRF compliance
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = `/delete_slot/${info.event.id}`;
                
                const csrfInput = document.createElement('input');
                csrfInput.type = 'hidden';
                csrfInput.name = 'csrf_token';
                csrfInput.value = '{{ csrf_token() }}';
                
                form.appendChild(csrfInput);
                document.body.appendChild(form);
                form.submit();
            }
        },
        slotMinTime: '08:00:00',
        slotMaxTime: '20:00:00',
        height: 'auto',
        allDaySlot: false
    });
    calendar.render();
});
</script>

<style>
#calendar { font-size: 0.85rem; }
.fc-toolbar-title { font-weight: bold; color: #0d6efd; font-size: 1.25rem !important; }
.fc-button-primary { background-color: #0d6efd !important; border-color: #0d6efd !important; border-radius: 50px !important; text-transform: capitalize; padding: 0.4rem 1rem !important; font-weight: bold !important; }
.fc-event { border-radius: 6px !important; border: none !important; padding: 2px 4px !important; cursor: pointer; }
.smallest { font-size: 0.75rem; }
</style>
{% endblock %}
