{% extends 'layout.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h2 class="h4 fw-bold mb-2">{{ t('Reset Password') }}</h2>
                    <p class="text-muted small mb-4">{{ t('Enter your admin username or email to generate a reset link.') }}</p>
                    <form method="post" class="row g-3">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="col-12">
                            <label class="form-label small fw-bold">{{ t('Username or Email') }}</label>
                            <input type="text" name="username_or_email" class="form-control" required autofocus>
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">{{ t('Send Reset Link') }}</button>
                            <a href="{{ url_for('login') }}" class="btn btn-outline-secondary rounded-pill px-4">{{ t('Back to Login') }}</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
