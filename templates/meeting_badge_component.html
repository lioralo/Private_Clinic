<!-- Meeting Type Badge Component - Add to calendar events -->
<template id="meetingBadgeTemplate">
    <span class="meeting-badge" title="{{ meeting_type_title }}">
        <i class="bi" data-type="{{ meeting_type }}"></i>
        <span class="badge-label">{{ meeting_type_label }}</span>
    </span>
</template>

<link rel="stylesheet" href="{{ url_for('static', filename='css/meeting_badge_component.css') }}">

<script>
/**
 * Enhanced Calendar Meeting Display
 * Shows meeting type badges and quick actions
 */
const MeetingTypeConfig = {
    'zoom': {
        icon: 'bi-camera-video-fill',
        label: 'Zoom',
        color: '#2563eb',
        bgColor: 'rgba(37, 99, 235, 0.1)',
        title: 'Zoom Meeting'
    },
    'google-meet': {
        icon: 'bi-camera-video-fill',
        label: 'Meet',
        color: '#65b741',
        bgColor: 'rgba(101, 183, 65, 0.1)',
        title: 'Google Meet'
    },
    'in-person': {
        icon: 'bi-person-fill',
        label: 'In-person',
        color: '#10b981',
        bgColor: 'rgba(16, 185, 129, 0.1)',
        title: 'In-person Meeting'
    }
};

function createMeetingBadge(meetingType) {
    if (!meetingType || !MeetingTypeConfig[meetingType]) return '';
    
    const config = MeetingTypeConfig[meetingType];
    const badge = document.createElement('span');
    badge.className = 'meeting-badge';
    badge.style.backgroundColor = config.bgColor;
    badge.style.borderLeft = `3px solid ${config.color}`;
    badge.title = config.title;
    
    const icon = document.createElement('i');
    icon.className = `bi ${config.icon}`;
    icon.style.color = config.color;
    
    const label = document.createElement('span');
    label.className = 'badge-label';
    label.textContent = config.label;
    label.style.color = config.color;
    
    badge.appendChild(icon);
    badge.appendChild(label);
    
    return badge;
}

function enhanceEventDisplay(eventEl, eventData) {
    if (!eventData || !eventData.extendedProps || !eventData.extendedProps.meta) return;
    
    const meta = eventData.extendedProps.meta;
    const titleContainer = eventEl.querySelector('.fc-event-title-container');
    
    if (!titleContainer) return;
    
    // Add meeting type badge
    if (meta.meeting_type) {
        const badge = createMeetingBadge(meta.meeting_type);
        if (badge) {
            titleContainer.appendChild(badge);
        }
    }
    
    // Add status indicator for appointments
    if (meta.type === 'appointment' && meta.patient_status) {
        const indicator = document.createElement('span');
        indicator.className = `appointment-status-badge status-${meta.patient_status}`;
        indicator.title = meta.patient_status;
        titleContainer.insertBefore(indicator, titleContainer.firstChild);
    }
}

// Hook into FullCalendar's eventDidMount event
function setupEventEnhancements(calendar) {
    calendar.on('eventDidMount', function(info) {
        enhanceEventDisplay(info.el, info.event);
    });
}
</script>
