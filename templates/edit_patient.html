{% extends 'layout.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('patient_detail', patient_id=patient['id']) }}" class="btn btn-outline-secondary btn-sm rounded-circle p-2 me-3 lh-1">
                <i class="bi bi-chevron-left"></i>
            </a>
            <h2 class="mb-0 fw-bold text-primary">Edit Patient</h2>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-4 p-lg-5">
                <div class="text-center mb-4 pb-2 border-bottom">
                    <h5 class="fw-bold mb-1">{{ patient['name'] }}</h5>
                    <p class="text-muted small">Update patient information</p>
                </div>
                
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="row g-4">
                        <div class="col-md-8">
                            <label for="name" class="form-label text-uppercase smallest fw-bold">Full Name</label>
                            <input type="text" class="form-control" name="name" id="name" value="{{ patient['name'] }}" required>
                        </div>

                        <div class="col-md-4">
                            <label for="status" class="form-label text-uppercase smallest fw-bold">Status</label>
                            <select class="form-select" name="status" id="status" required>
                                <option value="ongoing" {% if patient['status'] == 'ongoing' %}selected{% endif %}>Ongoing</option>
                                <option value="candidate" {% if patient['status'] == 'candidate' %}selected{% endif %}>Candidate</option>
                                <option value="archived" {% if patient['status'] == 'archived' %}selected{% endif %}>Archived</option>
                                <option value="waiting for scheduling" {% if patient['status'] == 'waiting for scheduling' %}selected{% endif %}>Waiting for Scheduling</option>
                            </select>
                        </div>

                        <div class="col-md-12">
                            <label for="email" class="form-label text-uppercase smallest fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" name="email" id="email" value="{{ patient['email'] or '' }}">
                            </div>
                        </div>

                        <div class="col-md-12">
                            <label for="phone" class="form-label text-uppercase smallest fw-bold">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                                <input type="text" class="form-control" name="phone" id="phone" value="{{ patient['phone'] or '' }}">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="birth_date" class="form-label text-uppercase smallest fw-bold">{{ t('Date of Birth') }}</label>
                            <input type="date" class="form-control" name="birth_date" id="birth_date" value="{{ patient['birth_date'] or '' }}">
                        </div>

                        <div class="col-md-6">
                            <label for="id_number" class="form-label text-uppercase smallest fw-bold">{{ t('ID Number') }}</label>
                            <input type="text" class="form-control" name="id_number" id="id_number" value="{{ patient['id_number'] or '' }}" maxlength="20">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label text-uppercase smallest fw-bold">Patient Type</label>
                            <div class="d-flex gap-3 mt-1">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="patient_type" id="typePrivate" value="private"
                                        {% if not patient['patient_type'] or patient['patient_type'] == 'private' %}checked{% endif %}>
                                    <label class="form-check-label" for="typePrivate">
                                        <i class="bi bi-person me-1"></i>Private
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="patient_type" id="typeResidency" value="residency"
                                        {% if patient['patient_type'] == 'residency' %}checked{% endif %}>
                                    <label class="form-check-label" for="typeResidency">
                                        <i class="bi bi-mortarboard me-1"></i>Residency
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="patient_type" id="typeGroup" value="group"
                                        {% if patient['patient_type'] == 'group' %}checked{% endif %}>
                                    <label class="form-check-label" for="typeGroup">
                                        <i class="bi bi-people-fill me-1"></i>Group
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="patient_type" id="typeInitialIntake" value="initial-intake"
                                        {% if patient['patient_type'] == 'initial-intake' %}checked{% endif %}>
                                    <label class="form-check-label" for="typeInitialIntake">
                                        <i class="bi bi-clipboard2-pulse me-1"></i>Initial Intake
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-12 {% if patient['patient_type'] != 'initial-intake' %}d-none{% endif %}" id="intakeFieldsWrap">
                            <label for="intake_assessment" class="form-label text-uppercase smallest fw-bold">Initial Intake Assessment</label>
                            <textarea class="form-control mb-3" name="intake_assessment" id="intake_assessment" rows="3" {% if patient['patient_type'] != 'initial-intake' %}disabled{% endif %}>{{ patient['intake_assessment'] or '' }}</textarea>
                            <label for="intake_questionnaire" class="form-label text-uppercase smallest fw-bold">Initial Intake Questionnaire</label>
                            <textarea class="form-control" name="intake_questionnaire" id="intake_questionnaire" rows="3" {% if patient['patient_type'] != 'initial-intake' %}disabled{% endif %}>{{ patient['intake_questionnaire'] or '' }}</textarea>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill">
                                <i class="bi bi-save me-2"></i> Save Patient Record
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const typeInputs = document.querySelectorAll('input[name="patient_type"]');
    const intakeWrap = document.getElementById('intakeFieldsWrap');
    const intakeAssessment = document.getElementById('intake_assessment');
    const intakeQuestionnaire = document.getElementById('intake_questionnaire');

    function syncIntakeFields() {
        const selected = document.querySelector('input[name="patient_type"]:checked');
        const isIntake = selected && selected.value === 'initial-intake';
        intakeWrap.classList.toggle('d-none', !isIntake);
        intakeAssessment.disabled = !isIntake;
        intakeQuestionnaire.disabled = !isIntake;
    }

    typeInputs.forEach((input) => input.addEventListener('change', syncIntakeFields));
    syncIntakeFields();
});
</script>
{% endblock %}
