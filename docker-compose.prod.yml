services:
  app:
    build: .
    container_name: private_clinic_app
    restart: unless-stopped
    env_file: .env
    environment:
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_BASE_URL: https://${DOMAIN}
      APP_BASE_URL: https://${DOMAIN}
      DATABASE: /data/clinic.db
      UPLOAD_FOLDER: /data/uploads
      PATIENT_LOGS_FOLDER: /data/patients_logs
      APP_LOG_FILE: /data/app_log.txt
      BACKUP_DIR: /data/secure_backups
      KEY_DIR: /data/.clinic_keys
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # SMTP — optional; leave unset to disable outbound email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      # Appointment reminders
      REMINDER_HOURS_BEFORE: ${REMINDER_HOURS_BEFORE:-24}
      REMINDER_SCHEDULER_INTERVAL: ${REMINDER_SCHEDULER_INTERVAL:-300}
      # Incoming email (IMAP) — optional
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_USE_SSL: ${IMAP_USE_SSL:-1}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      IMAP_POLL_INTERVAL: ${IMAP_POLL_INTERVAL:-300}
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    container_name: private_clinic_caddy
    restart: unless-stopped
    env_file: .env
    environment:
      DOMAIN: ${DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
